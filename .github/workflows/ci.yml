name: Media Backend CI Robot 🤖

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest 

    steps:
    # 1. الروبوت بيسحب الكود تبعك
    - name: 📥 Checkout Code
      uses: actions/checkout@v3

    # 2. بناء وتشغيل الحاويات (API, Cache, Worker) على سيرفر جيتهاب
    - name: 🐳 Start Docker Compose
      run: docker-compose up --build -d

    # 3. إعطاء النظام 5 ثواني عشان يشتغل براحته قبل الفحص
    - name: ⏳ Wait for services
      run: sleep 5

    # 4. تشغيل الفحص الآلي من جوا الحاوية (حرف T ضروري عشان جيتهاب ما يعلق)
    - name: 🧪 Run Pytest inside Docker
      run: docker-compose exec -T api pytest
        
    # 5. رسالة نجاح
    - name: ✅ Success Message
      run: echo "تم فحص الكود بالدوكر بنجاح! النظام جاهز."