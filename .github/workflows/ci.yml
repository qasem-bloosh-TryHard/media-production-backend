name: Media Backend CI Robot 🤖

# متى يشتغل الروبوت؟ كل ما تعمل Push على فرع main
on:
  push:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest # السيرفر الوهمي اللي رح يشتغل عليه الروبوت

    steps:
    # 1. الروبوت بيسحب الكود تبعك
    - name: 📥 Checkout Code
      uses: actions/checkout@v3

    # 2. الروبوت بيجهز بيئة بايثون
    - name: 🐍 Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. الروبوت بيحاول ينزل المكتبات ليتأكد إنها ما بتضرب أخطاء
    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    # 4. رسالة نجاح
    - name: ✅ Success Message
      run: echo "تم فحص الكود بنجاح يا هندسة! النظام جاهز للعمل."
      # 5. تشغيل الفحص الآلي
    - name: 🧪 Run Pytest
      run: |
        python -m pytest